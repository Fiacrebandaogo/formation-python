# =====================================================================
# Environnement de la formation Python pour l'analyse de donnees
#
#   Creation   : conda env create -f environment.yml
#   Activation : conda activate formation-python
#   Suppression: conda env remove -n formation-python
#
# Ce fichier couvre les 20 seances : aucun paquet ne devra etre
# installe en cours de formation.
# =====================================================================

name: formation-python

channels:
  - conda-forge

dependencies:
  # --- Noyau ---
  # Version figee : c'est la seule contrainte stricte, elle garantit
  # que tout le monde execute le meme interpreteur.
  - python=3.12

  # --- Interface de travail (seances 1 a 20) ---
  - jupyterlab>=4.2
  - ipykernel>=6.29
  - ipywidgets>=8.1

  # --- Manipulation de donnees (seances 6 a 12) ---
  - numpy>=2.0
  - pandas>=2.2

  # --- Import de fichiers (seance 13) ---
  - openpyxl>=3.1          # fichiers Excel .xlsx
  - xlrd>=2.0              # fichiers Excel anciens .xls
  - sqlalchemy>=2.0        # connexion aux bases de donnees
  - requests>=2.32         # telechargement depuis le web

  # --- Visualisation (seances 15 a 17) ---
  - matplotlib>=3.9
  - seaborn>=0.13

  # --- Statistiques (seances 18 et 19) ---
  - scipy>=1.13
  - statsmodels>=0.14
